spring.application.name=job-interview-tracker
spring.ai.mcp.server.name=job-interview-tracker-mcp
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC

spring.main.web-application-type=none
spring.main.banner-mode=off

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/job-interview-tracker

# STDIO transport uses stdout for protocol messages — suppress console logging
logging.pattern.console=
logging.file.name=./logs/mcp-server.log